[project]
name = "convonet"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cython<3",
    "h5py>=3.16.0",
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy<2",
    "pandas>=2.3.3",
    "pillow>=13.0.0",
    "plyfile>=1.1.3",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "setuptools>=81.0.0",
    "tensorboardx>=2.6.5",
    "torch==2.12.0",
    "torch-scatter==2.1.2 ; sys_platform == 'linux'",
    "torchvision>=0.27.0",
    "tqdm>=4.70.1",
    "trimesh>=5.1.1",
]

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pyg-pt212-cu130"
url = "https://data.pyg.org/whl/torch-2.12.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]
torch-scatter = [{ index = "pyg-pt212-cu130", marker = "sys_platform == 'linux'" }]

[tool.setuptools]
packages = []    # explicitní (prázdný) seznam vypne auto-discovery; rozšíření jsou v setup.py
